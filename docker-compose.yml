services:
  backend:
    build: ./back            # ./back의 Dockerfile로 이미지 빌드
    container_name: gshared-backend
    ports:
      - "8080:8080"          # 서버 8080 → 컨테이너 8080
    restart: unless-stopped   # 서버 재부팅·크래시 시 자동 재시작
    env_file:
      - .env                  # .env 값을 통째로 컨테이너에 전달
    environment:
      SPRING_PROFILES_ACTIVE: prod   # prod 프로필로 기동
    volumes:
      - ./logs:/app/logs      # 애플리케이션 로그를 서버에 보관
    depends_on:
      - mysql                 # mysql이 먼저 뜬 뒤 backend 시작
      - redis                 # redis도 먼저 기동

  mysql:
    image: mysql:8            # 도커허브 공식 MySQL 8 이미지
    container_name: gshared-mysql
    ports:
      - "3306:3306"           # 서버 3306 → 컨테이너 3306
    restart: unless-stopped
    environment:              # 값은 .env 파일에서 가져옴 (git에 비번 안 남김)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # root(관리자) 비밀번호
      MYSQL_DATABASE: ${MYSQL_DATABASE}             # 시작 시 자동 생성할 DB
      MYSQL_USER: ${MYSQL_USER}                     # 일반 사용자 계정
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}             # 일반 사용자 비밀번호
    volumes:
      - mysql-data:/var/lib/mysql   # DB 데이터를 컨테이너 밖(볼륨)에 보관

  redis:
    image: redis:8            # Refresh Token 저장 및 토큰 블랙리스트용
    container_name: gshared-redis
    restart: unless-stopped
    # 포트를 열지 않음 = 컨테이너끼리만 접근 가능
    volumes:
      - redis-data:/data      # 재시작해도 토큰 유지

  frontend:
    build: ./frontend        # Next.js SSR (standalone) 컨테이너
    container_name: gshared-frontend
    ports:
      - "3000:3000"          # 서버 3000 → 컨테이너 3000 (Next.js SSR은 내부 3000에서 node 실행)
    restart: unless-stopped

  # AI Scheduler (FastAPI + XGBoost) — ai/ 코드가 develop에 머지되면 주석 해제
  # backend가 http://ai:8000 으로 내부 호출 (바깥 포트 노출 불필요)
  # ⚠️ 해제 전 확인: ai/requirements.txt가 UTF-8 인코딩인지 (UTF-16이면 빌드 실패)
  # ai:
  #   build: ./ai
  #   container_name: gshared-ai
  #   restart: unless-stopped

volumes:
  mysql-data:                 # 명명된 볼륨 (컨테이너 지워도 데이터 유지)
  redis-data:                 # Refresh Token 보관용
