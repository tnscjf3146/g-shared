spring:
  profiles:
    default: local          # 아무것도 지정 안 하면 local

  jpa:
    open-in-view: false     # 지연 로딩이 컨트롤러까지 새는 걸 막음

  data:
    redis:
      port: 6379

# 값의 출처만 다르고 표현은 같음
#   local → .env 파일
#   prod  → compose 가 넣어주는 환경변수
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 30m
  refresh-expiration: 14d

# 지갑 연결 서명에 쓰는 값.
# domain/uri 는 사용자가 MetaMask 팝업에서 읽는 문장에 그대로 들어가므로
# 요청 본문이 아니라 서버 설정에서만 가져온다. (local 프로필에서 덮어씀)
wallet-auth:
  domain: ${WALLET_AUTH_DOMAIN}
  uri: ${WALLET_AUTH_URI}
  # 자체 토큰(GCoin)을 올린 네트워크의 ID. 토큰을 직접 만들어도 체인은 SSAFY 체인이다.
  # 로컬 Hardhat 노드(31337)에 붙일 때만 환경변수로 덮어쓴다.
  chain-id: ${WALLET_AUTH_CHAIN_ID:31221}
  challenge-expiration: 5m

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized   # 기본은 보수적으로

cookie:
  secure: true
