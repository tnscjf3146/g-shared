# Loki — 단일 바이너리 구성. 서버가 한 대이므로 분산 구성을 쓰지 않는다.
#
# 저장은 로컬 파일 시스템이다. S3 로 옮기는 것은 자격 증명 관리라는 새 문제를 만들고,
# 지금 규모(하루 수십 MB)에서는 얻는 것이 없다.

auth_enabled: false           # 멀티테넌시를 쓰지 않는다. 팀 하나, 서버 한 대.

server:
  http_listen_port: 3100
  # Loki 자신의 로그는 경고 이상만. 수집기가 그것까지 모으면 소음이 는다.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 30일. 하루 수십 MB 에 디스크 여유가 274GB 라 더 길게 잡아도 되지만,
  # 이 프로젝트가 30일보다 오래된 로그를 볼 일이 없다.
  retention_period: 720h

  # 받아들이는 나이는 **보존 기간과 같아야 한다.** 30일 보관하겠다면서 7일보다 오래된
  # 줄을 거절하면 앞뒤가 맞지 않는다.
  #
  # 처음에 168h(7일)로 두었다가 시험에서 터졌다. loki.source.docker 는 컨테이너의
  # 로그를 **처음부터** 읽는데, Redis 와 Jenkins 는 9월 3일부터 돌고 있어 18일치가
  # 쌓여 있었다. 오래된 줄이 배치를 400 으로 떨어뜨리면서 **같은 배치의 최신 줄까지
  # 함께 버려졌다.** 그래서 nginx 말고는 아무것도 들어오지 않았다.
  reject_old_samples: true
  reject_old_samples_max_age: 720h    # 30일 = retention_period 와 동일

  allow_structured_metadata: true

  # 삭제 요청 API 를 끈다. Loki 는 auth_enabled: false 로 돌고, Grafana 의 데이터소스
  # 프록시는 임의 경로를 그대로 넘긴다. 그래서 Grafana 계정을 쥔 쪽이 /loki/api/v1/delete
  # 로 기록을 지울 수 있다. 훔친 뒤 흔적을 지우는 조합이 성립한다.
  #
  # 이것을 꺼도 **보존 기간 삭제는 compactor 가 그대로 수행한다.** 둘은 다른 장치다.
  # 지울 일이 생기면 그때 잠깐 켠다.
  deletion_mode: disabled

  # 기본값은 4MB/s(버스트 6MB)인데, 기동할 때 과거 로그를 한꺼번에 읽어 들이는 구간에서
  # 이것을 넘긴다. 2026-09-21 에 nginx 회전본 15개를 동시에 읽다가 4,108줄(약 1MB)이
  # reason="rate_limited" 로 버려졌다.
  #
  # **Alloy 로그는 "will retry" 라고 말하지만 실제로는 버려진다.** 재시도가 성공한 것처럼
  # 보이고 오류도 남지 않아서, 회전본만 통째로 비어 있는 상태를 한참 못 알아챈다.
  # 확인은 Loki 의 loki_discarded_samples_total 로 한다.
  #
  # 평소 유입은 하루 수십 MB 라 이 한도에 닿지 않는다. 오직 처음 읽어 들일 때만 필요하다.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

  # Loki 3.x 는 로그에서 서비스 이름을 스스로 추측해 `service_name` 라벨을 붙인다.
  # 우리는 Alloy 에서 `service` 를 직접 정하므로 중복이고, 두 라벨이 어긋나면
  # 같은 서비스가 서로 다른 스트림으로 갈린다. 빈 목록으로 끈다.
  discover_service_name: []

# 보존 기간은 compactor 가 실제로 지운다. retention_period 만 적고 이 절을 빼면
# 설정은 통과하지만 아무것도 지워지지 않는다.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
