# G-shared 로그 수집 — Loki + Alloy + Grafana
#
# 서비스 compose(`s15p21e204`)와 **별도 프로젝트**로 띄운다. 프로젝트 이름이 다르면 컨테이너도
# 네트워크도 따로 생기므로, 이것을 올리거나 내려도 서비스 컨테이너는 재시작되지 않는다.
#
#   docker compose -p observability up -d
#   docker compose -p observability down        # 되돌리기. 볼륨까지 지우려면 -v
#
# 포트는 하나도 0.0.0.0 에 열지 않는다. 도커는 UFW 를 우회하므로 `127.0.0.1:` 접두어가 없으면
# 인터넷에 직통으로 열린다. 2026-09-18 에 MySQL 3306 이 실제로 그렇게 열려 있었다.
name: observability

services:
  # 로그 저장소. 라벨만 색인하고 본문은 질의할 때 훑는다.
  loki:
    image: grafana/loki:3.4.2
    container_name: obs-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    # ports 를 두지 않는다. Alloy 와 Grafana 가 같은 네트워크에서 loki:3100 으로 붙는다.

  # 수집기. Promtail 의 후계다 — Promtail 은 유지보수 모드를 거쳐 수명이 끝났다.
  alloy:
    image: grafana/alloy:v1.7.5
    container_name: obs-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      # 컨테이너 로그를 읽으려면 도커 소켓이 필요하다. 읽기 전용으로 붙이지만
      # 그것은 완화일 뿐 해결이 아니다 — README 의 "감수한 위험" 참고.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/nginx:/var/log/nginx:ro
      # 백엔드의 파일 로그. 도커 로그와 겹치지만 중복이 아니다 — 도커 로그는 컨테이너를
      # 다시 만들면 사라지고 이 파일은 14일을 버틴다. 재배포 이전의 과거는 여기에만 있다.
      # 절대 경로를 박지 않는 것은 다른 환경에서 시험할 때 깨지지 않게 하려는 것이다.
      - ${BACKEND_LOG_DIR:-/home/ubuntu/S15P21E204/logs}:/var/log/gshared-backend:ro
      # 워커 로그를 사람이 놓는 자리. 없으면 Alloy 가 조용히 넘어간다.
      - /var/log/gshared-workers:/var/log/gshared-workers:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.6.1
    container_name: obs-grafana
    restart: unless-stopped
    ports:
      # 프론트엔드가 3000 을 쓰므로 3001 로 옮긴다. 그리고 루프백에만 묶는다.
      # 인터넷에서 들어오는 길은 nginx 의 /grafana 하나뿐이다. 이 포트가 0.0.0.0 으로
      # 열리면 nginx 를 건너뛰고 직통으로 닿으므로 접두어를 절대 지우지 않는다.
      - "127.0.0.1:3001:3000"
    environment:
      # 비워 두면 기동을 거부한다. admin/admin 으로 뜨는 것을 막기 위해서다.
      #
      # `:?` 뒤는 셸 파라미터 확장의 오류 메시지 자리다. 한글을 넣으면 Compose 버전이나
      # 로케일에 따라 깨질 여지가 있어 영문으로 둔다. 자세한 안내는 .env.example 에 있다.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"

      # nginx 의 /grafana 하위 경로로 서비스한다. 이 둘이 없으면 Grafana 가 자기를
      # 루트(/)에 있다고 여겨서, 정적 자원과 로그인 뒤 redirect 가 전부 /grafana 를
      # 빼고 나간다. 화면이 하얗게 뜨는 흔한 원인이다.
      #
      # root_url 의 끝 슬래시는 필수다. 없으면 Grafana 가 경로를 한 칸 잘라 붙인다.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://j15e204.p.ssafy.io/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  loki-data:
  alloy-data:
  grafana-data:
