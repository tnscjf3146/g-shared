[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-compute-poc-setup"
version = "0.1.0"
description = "Windows Setup foundations for the GPU Compute PoC worker"
requires-python = ">=3.11"
dependencies = [
  "websockets==17.1",
]

[project.optional-dependencies]
setup-build = ["pyinstaller==6.22.2"]

[tool.setuptools.packages.find]
include = ["gpu_worker_setup*"]
